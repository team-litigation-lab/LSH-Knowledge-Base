<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LSH Knowledge Base</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">
      <img src="/favicon.png" alt="" width="36" height="36">
      <span><b>LSH Knowledge Base</b><small>LSH Community Library</small></span>
    </a>
    <form class="top-search" id="top-search" role="search" hidden>
      <label class="sr" for="top-q">Search the library</label>
      <input id="top-q" type="search" placeholder="Search SOPs, videos, guides…" autocomplete="off">
    </form>
    <nav class="top-nav" id="top-nav" hidden></nav>
  </div>
</header>
<main id="app" class="wrap" aria-live="polite">
  <p class="muted pad">Loading the library…</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/js/md.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/app.js"></script>
<!-- 🧭 the Blueprint: a VA deck and (admins) an admin deck, with a PDF of each.
     blueprint-content.js is this site's slides; lsh-blueprint.js is the same file on every LSH platform. -->
<script src="/js/blueprint-content.js"></script>
<script src="/js/lsh-blueprint.js"></script>
<script src="/js/show-password.js?v=1"></script>
</body>
</html>
